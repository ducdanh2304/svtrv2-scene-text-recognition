Global:
  device: gpu
  epoch_num: 20
  log_smooth_window: 20
  print_batch_step: 10
  output_dir: ./output/rec/waterec_r/navit_ar/
  save_epoch_step:
  - 15
  - 1
  eval_batch_step:
  - 0
  - 2000
  eval_epoch_step:
  - 0
  - 1
  cal_metric_during_train: true
  pretrained_model: null
  checkpoints: null
  use_tensorboard: false
  infer_img: null
  character_dict_path: __E2E_FINAL_ROOT__/external/OpenOCR-WATERec/tools/utils/EN_symbol_dict.txt
  max_text_length: 25
  use_space_char: false
  max_seq_len: 256
  min_seq_len: 64
  save_res_path: ./output/rec/u14m/waterec_r/predicts.txt
  use_amp: true
Optimizer:
  name: AdamW
  lr: 0.00065
  weight_decay: 0.05
  filter_bias_and_bn: true
LRScheduler:
  name: OneCycleLR
  warmup_epoch: 1.5
  cycle_momentum: false
Architecture:
  model_type: rec
  algorithm: NaViTNRTR
  in_channels: 3
  Transform: null
  Encoder:
    name: NaViT_ROPE
    patch_size:
    - 4
    - 4
    embed_dim: 384
    depth: 12
    num_heads: 6
    mlp_ratio: 4
  Decoder:
    name: NaARDecoder
    beam_size: 0
    num_decoder_layers: 2
    nhead: 12
    max_len: 25
Loss:
  name: ARLoss
PostProcess:
  name: ARLabelDecode
  character_dict_path: __E2E_FINAL_ROOT__/external/OpenOCR-WATERec/tools/utils/EN_symbol_dict.txt
  use_space_char: false
Metric:
  name: RecMetric
  main_indicator: acc
  is_filter: true
Train:
  dataset:
    name: LMDBDataSet
    data_dir: ../WATER-R/
    transforms:
    - DecodeImagePIL:
        img_mode: RGB
    - PARSeqAugPIL: null
    - ARLabelEncode:
        character_dict_path: ./tools/utils/EN_symbol_dict.txt
        use_space_char: false
        max_text_length: 25
    - NaRecTVResize:
        patch_size: 4
        max_seq_len: 256
        min_seq_len: 64
    - KeepKeys:
        keep_keys:
        - image
        - label
        - length
  loader:
    collate_fn: NoCollator
    shuffle: true
    batch_size_per_card: 128
    drop_last: true
    num_workers: 4
Eval:
  dataset:
    name: LMDBDataSet
    data_dir: ../ic15_data/
    transforms:
    - DecodeImagePIL:
        img_mode: RGB
    - ARLabelEncode:
        character_dict_path: ./tools/utils/EN_symbol_dict.txt
        use_space_char: false
        max_text_length: 25
    - NaRecTVResize:
        patch_size: 4
        max_seq_len: 256
        min_seq_len: 64
    - KeepKeys:
        keep_keys:
        - image
        - label
        - length
  loader:
    collate_fn: NoCollator
    shuffle: false
    drop_last: false
    batch_size_per_card: 128
    num_workers: 4
